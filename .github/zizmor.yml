# Homebrew's own actions are published only as a moving `@main` ref (no tags
# or release SHAs), so `actionlint.yml` pins them by ref. Without this policy
# zizmor's `unpinned-uses` rule would fail on `Homebrew/actions/*@main`.
rules:
  unpinned-uses:
    config:
      policies:
        Homebrew/actions/*: ref-pin
