version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "08:00"
      timezone: Etc/UTC
    groups:
      go-dependencies:
        patterns:
          - "*"
    allow:
      - dependency-type: all

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "08:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns:
          - "*"
    allow:
      - dependency-type: all
