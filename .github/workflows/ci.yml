name: CI

on:
  push:
    branches: [main, ruby]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Tidy
        run: go mod tidy -diff

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  reuse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  vale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Homebrew is preinstalled on the runner but not on PATH; invoke brew by
      # absolute path to install, then expose its bin so `make vale` finds vale.
      - name: Install Vale
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install vale
          printf '%s\n' /home/linuxbrew/.linuxbrew/bin >> "${GITHUB_PATH}"

      - name: Vale
        run: |
          vale --version
          make vale

  lint-perms:
    # Single source of truth for the policy and check is scripts/lint-perms.sh;
    # .githooks/pre-commit invokes the same script with --staged. This job runs
    # it with --tracked over the whole tree, catching a missing execute bit
    # (e.g. a hook committed 100644) that would otherwise ship silently.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify execute bit on shipped scripts
        env:
          LINT_PERMS_FORMAT: ci
        run: |
          if [ ! -x ./scripts/lint-perms.sh ]; then
            echo "::error file=scripts/lint-perms.sh::missing or not executable in the checkout"
            exit 1
          fi
          ./scripts/lint-perms.sh --tracked
