name: CI

on:
  push:
    branches: [main, ruby]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Tidy
        run: go mod tidy && git diff --exit-code go.sum

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: raven-actions/actionlint@v2

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE compliance
        uses: fsfe/reuse-action@v5

  vale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Homebrew is preinstalled on the runner but not on PATH; invoke brew by
      # absolute path to install, then expose its bin so `make vale` finds vale.
      - name: Install Vale
        # env:
          # HOMEBREW_NO_AUTO_UPDATE: '1'
          # HOMEBREW_NO_ANALYTICS: '1'
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install vale
          printf '%s\n' /home/linuxbrew/.linuxbrew/bin >> "${GITHUB_PATH}"

      - name: Vale
        run: |
          vale --version
          make vale
