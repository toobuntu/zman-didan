# Vale prose linter — en_US spelling only.
#
# Vale.Spelling ships an en_US-only dictionary and rejects en_GB variants
# (licence/colour/normalise/labelled/…). Vale.Terms (which enforces one
# canonical casing per vocab term, and so rejects "chabad.org", "HaTanya", a
# sentence-initial "Zmanim", etc.) and Vale.Repetition are disabled — only
# spelling is wanted. Project/Hebrew/Judaica/code terms are allow-listed in
# .vale/styles/config/vocabularies/Didan/accept.txt (matched case-insensitively).
# The `code` scope is ignored by default, so backticked identifiers need no
# vocab entry; TokenIgnores drops the one prose token the speller mis-splits.
#
# Install: brew install vale
StylesPath = .vale/styles
MinAlertLevel = error
Vocab = Didan

[*.md]
BasedOnStyles = Vale
Vale.Terms = NO
Vale.Repetition = NO
TokenIgnores = B'Av

# Design docs embed Go snippets; session handoffs are working notes full of
# tool and identifier names — skip spell-checking both.
[docs/zmanim_parser*.md]
Vale.Spelling = NO

[docs/handoff/*.md]
Vale.Spelling = NO
