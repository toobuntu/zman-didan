# Vale prose linter — en_US spelling and impersonal phrasing.
#
# Vale.Spelling ships an en_US-web dictionary but accepts many en_GB forms
# (synthesise, organise, colour, …) as valid English, so it catches typos, not
# dialect. The custom Didan style enforces dialect deterministically:
#   Didan.AmericanSpelling — explicit British -> American map (error)
#   Didan.We               — first-person plural in prose/comments (error)
# Vale.Terms (one canonical casing per vocab term — rejects "chabad.org",
# "HaTanya", a sentence-initial "Zmanim", …) and Vale.Repetition are disabled;
# only spelling and the Didan rules are wanted. Project/Hebrew/Judaica/code
# terms are allow-listed in .vale/styles/config/vocabularies/Didan/accept.txt
# (matched case-insensitively). The `code` scope is ignored by default, so
# backticked identifiers need no vocab entry; TokenIgnores drops the one prose
# token the speller mis-splits.
#
# Install: brew install vale
StylesPath = .vale/styles
MinAlertLevel = error
Vocab = Didan

[*.md]
BasedOnStyles = Vale, Didan
Vale.Terms = NO
Vale.Repetition = NO
TokenIgnores = B'Av

# Go-comment linting is staged but OFF: Vale lints Go comments AND string
# literals, so enabling this can fail CI on pre-existing comment/string text
# that AmericanSpelling or We flags. Enable only after `vale cmd/ internal/`
# (see the Makefile `vale` target) is clean locally. Vale.Spelling stays off
# here — identifiers and abbreviations in comments would be too noisy.
# [*.go]
# BasedOnStyles = Didan
# Vale.Spelling = NO

# Design docs embed Go snippets; session handoffs are working notes full of
# tool and identifier names — skip spell-checking both.
[docs/zmanim_parser*.md]
Vale.Spelling = NO

[docs/handoff/*.md]
# Handoff docs are second-person working notes / prompts: "we"/"our" is natural
# in a collaborative brief, and they are full of tool and identifier names — so
# the impersonal-voice rule and dictionary spelling are off here. en_US spelling
# (Didan.AmericanSpelling) is NOT relaxed: dialect is a correctness matter,
# enforced everywhere.
Vale.Spelling = NO
Didan.We = NO
